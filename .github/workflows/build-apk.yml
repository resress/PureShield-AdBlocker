name: 自動編譯 Android 擋廣告 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 雲端編譯 PureShield 擋廣告 APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出專案原始碼
        uses: actions/checkout@v4

      - name: 2. 設定 JDK 17 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 安裝與設定 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. 執行 Gradle 編譯 APK
        run: gradle assembleDebug

      - name: 5. 整理輸出 APK 檔案
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PureShield-AdBlocker-v1.0.apk

      - name: 6. 上傳 APK 至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PureShield-AdBlocker-APK
          path: PureShield-AdBlocker-v1.0.apk
          retention-days: 90

      - name: 7. 自動發布至 GitHub Releases (提供直連下載 APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PureShield 淨盾擋廣告 v1.0.0 (APK 直接下載)"
          body: "自動雲端編譯完成的 Android 擋廣告 APK 安裝檔。請直接點擊下方 `PureShield-AdBlocker-v1.0.apk` 下載安裝至手機。"
          files: PureShield-AdBlocker-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
